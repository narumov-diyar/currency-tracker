<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Currency Tracker">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de2a4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#tile)"/>

  <!-- Три растущие свечи: знак читается и в шестнадцати пикселях вкладки,
       где тонкая кривая слилась бы в пятно. -->
  <g fill="#06080d">
    <rect x="7.2" y="15" width="1.6" height="12" rx="0.8"/>
    <rect x="5.6" y="17" width="4.8" height="8" rx="1.4"/>

    <rect x="15.2" y="10" width="1.6" height="14" rx="0.8"/>
    <rect x="13.6" y="12" width="4.8" height="9" rx="1.4"/>

    <rect x="23.2" y="5.5" width="1.6" height="14" rx="0.8"/>
    <rect x="21.6" y="7.5" width="4.8" height="10" rx="1.4"/>
  </g>
</svg>
