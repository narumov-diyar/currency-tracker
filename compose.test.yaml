# Самостоятельный файл, не дополнение к compose.yaml: рабочая база сюда не входит.
services:
  test-db:
    profiles: [test]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tracker_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: tracker_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tracker_test -d tracker_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  server-tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://tracker_test:test-only-password@test-db:5432/tracker_test?sslmode=disable
    depends_on:
      test-db:
        condition: service_healthy

  collector-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.collector
      target: test
    environment:
      TEST_DATABASE_URL: postgres://tracker_test:test-only-password@test-db:5432/tracker_test?sslmode=disable
    depends_on:
      test-db:
        condition: service_healthy

  web-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.web
      target: test
