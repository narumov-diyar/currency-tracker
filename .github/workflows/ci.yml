name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  server:
    name: Серверная часть
    runs-on: ubuntu-latest

    # Тесты схемы работают с настоящей базой, поэтому она поднимается
    # сервисным контейнером: без неё они молча пропускаются.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Проверка форматирования
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы:"
            echo "$unformatted"
            exit 1
          fi

      - name: Статический анализ
        run: go vet ./...

      - name: Сборка
        run: go build ./...

      # Детектор гонок обязателен: буфер котировок и список зрителей трогают
      # из нескольких горутин, а гонки проявляются не каждый прогон.
      - name: Тесты
        env:
          TEST_DATABASE_URL: postgres://tracker:tracker@localhost:5432/tracker?sslmode=disable
        run: go test ./... -race -count=1

  image:
    name: Образ сервера
    runs-on: ubuntu-latest

    # Контейнер запускается с сетью хоста, поэтому обращается к базе по
    # localhost так же, как шаги задания.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t currency-tracker-api:ci .

      - name: Запуск контейнера
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL='postgres://tracker:tracker@localhost:5432/tracker?sslmode=disable' \
            -e AUTH_SECRET='ci-secret-key-not-shorter-than-32-characters' \
            currency-tracker-api:ci

      - name: Готовность сервера
        run: |
          for i in $(seq 30); do
            if curl -fsS http://localhost:8080/health | grep -q '"ok"'; then
              echo "сервер ответил через $i с"
              exit 0
            fi
            sleep 1
          done
          echo "сервер не ответил, журнал контейнера:"
          docker logs api
          exit 1

      - name: Миграции накатаны контейнером
        run: |
          applied=$(docker exec -i "$(docker ps -q -f name=postgres)" \
            psql -U tracker -d tracker -tAc 'SELECT count(*) FROM schema_migrations' 2>/dev/null \
            || psql "postgres://tracker:tracker@localhost:5432/tracker?sslmode=disable" \
                 -tAc 'SELECT count(*) FROM schema_migrations')
          echo "применено миграций: $applied"
          test "$applied" -ge 3

      - name: Справочник активов отдаётся
        run: |
          count=$(curl -fsS http://localhost:8080/api/assets | grep -o '"symbol"' | wc -l)
          echo "активов в справочнике: $count"
          test "$count" -eq 40

      - name: Журнал контейнера
        if: always()
        run: docker logs api

  # Задания без needs выполняются параллельно, и падение одного не отменяет
  # остальные. Тестам сборщика база и сеть не нужны: источники и хранилище
  # в них подменяются.
  collector:
    name: Сборщик
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r collector/requirements-dev.txt

      - name: Линтер
        run: ruff check collector

      - name: Тесты
        run: python -m pytest collector

  web:
    name: Клиентская часть
    runs-on: ubuntu-latest

    # Все команды выполняются в папке клиента: package.json лежит там,
    # а не в корне репозитория.
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 требует Node не ниже 22.12.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci, а не npm install: ставит ровно то, что записано
      # в package-lock.json, и падает, если он разошёлся с package.json.
      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-compose-password
      AUTH_SECRET: ci-compose-secret-key-not-shorter-than-32-characters

    steps:
      - uses: actions/checkout@v4

      - name: Запуск компонентов
        run: bash scripts/dev.sh up

      - name: Проверка веб-клиента и API
        run: |
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          count=$(curl -fsS http://127.0.0.1:3000/api/assets | grep -o '"symbol"' | wc -l)
          test "$count" -eq 40
          docker compose ps --status running --services | grep -qx collector

      - name: Тесты в контейнерах
        run: bash scripts/test.sh

      - name: Журналы и очистка
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down --volumes
